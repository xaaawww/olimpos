<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pago no procesado — OlimpΩs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --panel-dark: oklch(0.20 0.012 70); --cream: oklch(0.95 0.012 85); --cream-soft: oklch(0.86 0.015 80); --gold: oklch(0.78 0.11 88); --red: oklch(0.65 0.18 25); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--panel-dark); color: var(--cream); font-family: "Manrope", system-ui, sans-serif;
    padding: 32px 20px; text-align: center;
  }
  .card { max-width: 420px; }
  .icono { font-size: 52px; margin-bottom: 18px; }
  h1 { font-family: "Bodoni Moda", serif; font-size: 30px; margin: 0 0 12px; color: var(--red); }
  p { color: var(--cream-soft); font-size: 15px; line-height: 1.5; margin: 0 0 6px; }
  .marca { margin-top: 36px; font-family: "Bodoni Moda", serif; font-weight: 700; color: var(--gold); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="card">
    <div class="icono">✕</div>
    <h1>El pago no se pudo procesar</h1>
    <p>No se te cobró nada. Volvé a la app y probá de nuevo desde "Mi membresía".</p>
    <div class="marca">OlimpΩs</div>
  </div>
</body>
</html>
