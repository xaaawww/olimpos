name = "pagos-olimpos"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# El nombre del proyecto de Firebase (olimpos-18320) — el token de la app
# móvil se verifica contra este proyecto exacto (el LOGIN sigue en Firebase
# Authentication). No es secreto, se puede dejar en el archivo.
[vars]
FIREBASE_PROJECT_ID = "olimpos-18320"

# Secretos (se cargan con "npx wrangler secret put <NOMBRE>", nunca acá):
#   MP_ACCESS_TOKEN — Access Token de PRUEBA de Mercado Pago (pestaña
#                     "Credenciales de prueba" del panel de MP).
#   DATABASE_URL    — cadena de conexión de Neon (postgresql://...). Reemplaza
#                     a FIREBASE_SA_EMAIL / FIREBASE_SA_PRIVATE_KEY, que ya no
#                     hacen falta (los pagos y las membresías están en Neon).
