name = "argos-olimpos"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# URL de la API del club (Worker "api-olimpos"): ahí viven el plan de
# membresía y el cupo diario de Argos (base de datos Neon). No es secreto.
[vars]
API_URL = "https://api-olimpos.argosolimpo.workers.dev"

# Conexión directa con el Worker de la API (Service Binding). Cloudflare NO
# deja que un Worker llame a otro de la misma cuenta por su dirección pública
# *.workers.dev (lo corta y Argos respondía "No se pudo verificar tu plan de
# membresía" aunque el plan estuviera bien): tiene que ser por acá.
[[services]]
binding = "API"
service = "api-olimpos"

# Secreto (se carga con "npx wrangler secret put ANTHROPIC_API_KEY", nunca acá):
#   ANTHROPIC_API_KEY — clave de la API de Anthropic.
#
# (Antes el cupo diario vivía en un KV "ARGOS_KV" y el plan se leía de
# Firestore: las dos cosas pasaron a la base de datos relacional.)
